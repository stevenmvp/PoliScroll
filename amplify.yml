version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - cd ../.. && npm ci
            - cd apps/web
            - npm ci
        build:
          commands:
            - cd ../.. && npm run backend:typecheck
            - cd ../.. && node ./node_modules/@aws-amplify/backend-cli/lib/ampx.js pipeline-deploy --branch "$AWS_BRANCH" --app-id "$AWS_APP_ID" --outputs-out-dir apps/web
            - cd apps/web
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
