version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - cd "$CODEBUILD_SRC_DIR/PoliScroll" && npm ci
            - cd "$CODEBUILD_SRC_DIR/PoliScroll/apps/web" && npm ci
        build:
          commands:
            - cd "$CODEBUILD_SRC_DIR/PoliScroll" && npm run backend:typecheck
            - cd "$CODEBUILD_SRC_DIR/PoliScroll" && npm exec --yes --package=@aws-amplify/backend-cli@1.10.0 -- ampx pipeline-deploy --branch "$AWS_BRANCH" --app-id "$AWS_APP_ID" --outputs-out-dir "$CODEBUILD_SRC_DIR/PoliScroll/apps/web"
            - cd "$CODEBUILD_SRC_DIR/PoliScroll/apps/web" && npm run build
      artifacts:
        baseDirectory: dist
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
          - ../../node_modules/**/*
