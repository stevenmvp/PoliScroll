version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "Preparing static web app"
    build:
      commands:
        - mkdir -p apps/web/dist
        - cp apps/web/index.html apps/web/dist/index.html
  artifacts:
    baseDirectory: apps/web/dist
    files:
      - "**/*"
  cache:
    paths: []
