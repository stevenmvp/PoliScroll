version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
            - npm ci --prefix apps/web
        build:
          commands:
            - npm run backend:typecheck
            - npm exec --yes --package=@aws-amplify/backend-cli@1.10.0 -- ampx pipeline-deploy --branch "$AWS_BRANCH" --app-id "$AWS_APP_ID" --outputs-out-dir apps/web
            - npm run build --prefix apps/web
      artifacts:
        baseDirectory: dist
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
