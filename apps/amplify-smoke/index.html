<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Prueba mínima de despliegue de PoliScroll en Amplify" />
    <title>PoliScroll | Amplify smoke test</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Georgia, 'Times New Roman', serif;
        background: #f4efe6;
        color: #173b3f;
      }

      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; }
      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        background: radial-gradient(circle at top right, #f2b36d 0, transparent 30%), #f4efe6;
      }
      section {
        width: min(100%, 680px);
        padding: clamp(32px, 8vw, 72px);
        border: 1px solid rgba(23, 59, 63, 0.18);
        background: rgba(255, 252, 246, 0.88);
        box-shadow: 12px 12px 0 #173b3f;
      }
      p { line-height: 1.6; }
      .eyebrow {
        margin: 0 0 16px;
        font: 700 0.75rem/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #b34f36;
      }
      h1 { margin: 0; font-size: clamp(2.5rem, 8vw, 5.5rem); line-height: 0.95; }
      .status {
        display: inline-flex;
        gap: 10px;
        align-items: center;
        margin-top: 24px;
        padding: 10px 14px;
        background: #d7e8c8;
        color: #173b3f;
        font: 700 0.8rem/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
        text-transform: uppercase;
      }
      .status::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: #3d7b4b; }
    </style>
  </head>
  <body>
    <main>
      <section>
        <p class="eyebrow">PoliScroll / Amplify smoke test</p>
        <h1>El despliegue está vivo.</h1>
        <p>Este módulo es una prueba aislada. Si esta pantalla aparece en la URL de Amplify, la conexión y la publicación de artefactos funcionan; el siguiente diagnóstico queda dentro de la aplicación Next.</p>
        <div class="status">Amplify respondió correctamente</div>
      </section>
    </main>
  </body>
</html>
